version: '3.9'

# =============================================================================
# Trinamix Portfolio Command Center — local dev stack
#
# Usage:
#   docker compose up postgres            # just the DB (run API/frontend locally)
#   docker compose up                     # postgres + redis + api
#   docker compose --profile tools up     # adds pgAdmin
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trinamix
      POSTGRES_PASSWORD: trinamix
      POSTGRES_DB: portfolio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trinamix -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pcc_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
    container_name: pcc_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://trinamix:trinamix@postgres:5432/portfolio?schema=public
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: mock
    ports:
      - '4000:4000'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pcc_pgadmin
    restart: unless-stopped
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trinamix.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
