services:
  # ── API (NestJS + MongoDB) ──────────────────────────────────────────────────
  - type: web
    name: portfolio-command-center-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma db push && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # set to your Render static site URL after deploy

  # ── Frontend (React/Vite static site) ──────────────────────────────────────
  - type: static
    name: portfolio-command-center-ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your API URL e.g. https://portfolio-command-center-api.onrender.com
      - key: VITE_USE_API
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
